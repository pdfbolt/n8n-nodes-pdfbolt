name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Check tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME#v}" = "$PKG_VERSION" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"; exit 1; }
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # --ignore-scripts skips native builds of dev-only dependencies (isolated-vm from @n8n/node-cli)
      - run: npm ci --ignore-scripts
      # In GitHub Actions, n8n-node release runs lint and build, then npm publish with provenance
      - run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
